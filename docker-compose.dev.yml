version: "3.9"

networks:
  amazon-clone:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - amazon-clone

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - amazon-clone

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.example
    networks:
      - amazon-clone

  api-gateway:
    build:
      context: ./backend/api-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./backend/api-gateway/.env.example
    depends_on:
      - postgres
      - redis
    networks:
      - amazon-clone

  auth-service:
    build:
      context: ./backend/auth-service
    ports:
      - "8001:8001"
    env_file:
      - ./backend/auth-service/.env.example
    depends_on:
      - postgres
      - redis
    networks:
      - amazon-clone

  user-service:
