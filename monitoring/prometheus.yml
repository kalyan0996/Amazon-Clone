global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "amazon-clone-services"
    metrics_path: /metrics/
    static_configs:
      - targets:
        - api-gateway:8000
        - auth-service:8001
        - user-service:8002
        - product-service:8003
        - catalog-service:8004
        - inventory-service:8005
        - cart-service:8006
        - order-service:8007
        - payment-service:8008
        - shipping-service:8009
        - review-service:8010
        - rating-service:8011
        - recommendation-service:8012
        - search-service:8013
        - notification-service:8014
        - wishlist-service:8015
        - seller-service:8016
        - pricing-service:8017
        - analytics-service:8018
        - admin-service:8019
