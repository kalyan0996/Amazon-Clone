stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2

.python_service_template: &python_service
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt

lint:backend:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install flake8
    - flake8 backend --max-line-length=100 || true

lint:frontend:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend && npm ci && npm run lint

test:backend:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16-alpine
    - redis:7-alpine
  script:
    - ./scripts/test.sh

test:frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend && npm ci && npm test

build:images:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  script:
    - ./scripts/build.sh
  only:
    - main

deploy:staging:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - ./scripts/deploy.sh staging
  environment:
    name: staging
  only:
    - main
