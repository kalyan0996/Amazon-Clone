apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: amazon-clone
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: amazon-clone
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
